apiVersion: apps/v1
kind: Deployment
metadata:
  name: pytesseract-deployment
  labels:
    app: pytesseract
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pytesseract
  template:
    metadata:
      labels:
        app: pytesseract
    spec:
      volumes:
        - name: holy-storage
          persistentVolumeClaim:
            claimName: holy-pvc
      containers:
        - name: pytesseract
          volumeMounts:
            - name: holy-storage
              mountPath: /data
          image: pytesseract
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          env:
            - name: img_dir
              value: "/data/uploads"
            - name: public_url
              value: "http://localhost:30333"
