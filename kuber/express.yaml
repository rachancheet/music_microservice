apiVersion: apps/v1
kind: Deployment
metadata:
  name: express-deployment
  labels:
    app: express
spec:
  replicas: 1
  selector:
    matchLabels:
      app: express
  template:
    metadata:
      labels:
        app: express
    spec:
      containers:
        - name: express
          image: express
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          env:
            - name: node_port
              value: "3001"
            - name: public_url
              value: "http://localhost:30333"
          volumeMounts:
            - name: holy-storage
              mountPath: /data
      volumes:
        - name: holy-storage
          persistentVolumeClaim:
            claimName: holy-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: express-service
spec:
  selector:
    app: express
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001
      nodePort: 30333
  type: NodePort
